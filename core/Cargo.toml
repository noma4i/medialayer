[package]
name = "medialayer"
version = "3.12.1"
edition = "2021"

[lib]
crate-type = ["lib", "cdylib", "staticlib"]
name = "medialayer"

[dependencies]
uniffi = "0.32.2"
sha2 = "0.11.0"
url = "2.5.4"
thiserror = "2.0.21"
async-trait = "0.1.92"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "fs", "io-util", "sync", "time", "macros", "net"] }
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
http-body-util = "0.1.5"
bytes = "1.12.1"
futures-util = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
statig = "0.4.1"

[dev-dependencies]
libc = "0.2"
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["test-util"] }
