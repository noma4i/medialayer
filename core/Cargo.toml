[package]
name = "medialayer"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["lib", "cdylib", "staticlib"]
name = "medialayer"

[features]
cli = ["uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[dependencies]
uniffi = "0.32.2"
sha2 = "0.11.0"
url = "2.5.4"
thiserror = "2.0.21"
